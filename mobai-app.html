<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>陌拜通 · 美业采集助手</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a1a2e'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='%23fff'%3E陌%3C/text%3E%3C/svg%3E">
<style>
:root{--primary:#1a1a2e;--primary-light:#16213e;--accent:#e94560;--success:#27ae60;--warning:#f39c12;--danger:#e74c3c;--bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--text2:#666;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
/* Splash / Auth */
#splash{position:fixed;inset:0;background:var(--primary);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{font-size:48px;margin-bottom:8px}
#splash h1{font-size:22px;font-weight:700;letter-spacing:2px}
#splash p{font-size:13px;opacity:.7;margin-top:4px}
#splash .loader{margin-top:24px;width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Auth Page */
.page{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.active{display:flex;flex-direction:column}
#auth-page{background:linear-gradient(135deg,var(--primary),#0f3460);justify-content:center;align-items:center;padding:24px}
.auth-box{width:100%;max-width:360px}
.auth-logo{text-align:center;margin-bottom:24px;color:#fff}
.auth-logo .icon{font-size:48px}
.auth-logo h1{font-size:20px;font-weight:700;margin-top:6px;letter-spacing:2px}
.auth-logo p{font-size:12px;opacity:.7;margin-top:4px}
.auth-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.auth-card h2{font-size:16px;font-weight:600;margin-bottom:16px;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
.field label .req{color:var(--danger)}
.field input,.field select{width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;background:#fafafa;transition:border .2s}
.field input:focus,.field select:focus{border-color:var(--primary);background:#fff}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{opacity:.85}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn-sm{padding:8px;font-size:12px}
.btn-block{display:block;width:100%}
.auth-switch{text-align:center;margin-top:12px;font-size:12px;color:var(--text2)}
.auth-switch a{color:var(--primary);font-weight:600;cursor:pointer}

/* Main Layout */
#main-layout{display:none;height:100%;flex-direction:column}
#main-layout.active{display:flex}
.top-bar{background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:50px}
.top-bar .back-btn{font-size:20px;cursor:pointer;padding:4px;display:none}
.top-bar .back-btn.show{display:block}
.top-bar .title{font-size:15px;font-weight:600;flex:1}
.top-bar .user-info{font-size:11px;opacity:.8;display:flex;align-items:center;gap:6px}
.top-bar .user-info .role-badge{background:var(--accent);color:#fff;font-size:9px;padding:1px 6px;border-radius:4px}
.main-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;padding-bottom:70px}

/* Bottom Tab Bar */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #eee;display:flex;padding:4px 0 env(safe-area-inset-bottom);z-index:100}
.tab-item{flex:1;text-align:center;padding:4px 0;font-size:10px;color:#999;cursor:pointer;transition:color .2s}
.tab-item .tab-icon{font-size:20px;display:block;margin-bottom:1px}
.tab-item.active{color:var(--primary);font-weight:600}
.tab-item.active .tab-icon{color:var(--accent)}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h3{font-size:14px;font-weight:600;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #f0f0f0}
.card .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
.card .stat-item{text-align:center;padding:8px}
.card .stat-item .num{font-size:22px;font-weight:700;color:var(--primary)}
.card .stat-item .lbl{font-size:10px;color:var(--text2);margin-top:2px}

/* Check-in */
.checkin-btn{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--radius);cursor:pointer;transition:all .2s}
.checkin-btn.ready{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff}
.checkin-btn.done{background:#eee;color:#999}
.checkin-btn .icon{font-size:28px}
.checkin-btn .info{flex:1}
.checkin-btn .info .title{font-size:15px;font-weight:600}
.checkin-btn .info .sub{font-size:11px;opacity:.8;margin-top:2px}

/* Visit List */
.visit-item{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:8px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--accent)}
.visit-item .v-name{font-size:14px;font-weight:600}
.visit-item .v-addr{font-size:11px;color:var(--text2);margin-top:2px}
.visit-item .v-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.visit-item .v-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:#f0f0f0;color:#555}
.visit-item .v-tag.s{background:#d4edda;color:#155724}
.visit-item .v-tag.a{background:#cce5ff;color:#004085}
.visit-item .v-tag.b{background:#fff3cd;color:#856404}
.visit-item .v-tag.c{background:#f8d7da;color:#721c24}
.visit-item .v-pay{position:absolute;top:10px;right:10px;font-size:16px;font-weight:700;color:var(--success)}

/* Admin */
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.admin-grid .card{padding:12px;margin:0}
.admin-worker{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:8px;margin-bottom:6px;box-shadow:var(--shadow)}
.admin-worker .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.admin-worker .status-dot.online{background:var(--success)}
.admin-worker .status-dot.offline{background:#ccc}
.admin-worker .status-dot.working{background:var(--warning)}
.admin-worker .w-info{flex:1}
.admin-worker .w-info .w-name{font-size:13px;font-weight:600}
.admin-worker .w-info .w-stat{font-size:10px;color:var(--text2);margin-top:1px}
.admin-worker .w-actions{display:flex;gap:4px}
.admin-worker .w-actions button{font-size:10px;padding:4px 8px;border:none;border-radius:4px;cursor:pointer}

/* Forms */
.form-section{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.form-section h3{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--primary)}
.form-section .field{margin-bottom:12px}
.form-section .field:last-child{margin-bottom:0}

/* Photo Upload */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.photo-slot{aspect-ratio:1;border:2px dashed #ddd;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#bbb;cursor:pointer;overflow:hidden;position:relative}
.photo-slot.has-photo{border-color:var(--success);border-style:solid}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.photo-slot .slot-label{font-size:8px;margin-top:2px}
.photo-slot .check{position:absolute;top:2px;right:2px;background:var(--success);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center}

/* Location */
.location-display{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f5f5f5;border-radius:6px;font-size:11px;color:var(--text2)}
.location-display .loc-icon{font-size:16px}
.location-display .loc-text{flex:1}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:320px;text-align:center}
.toast.show{opacity:1}

/* Empty */
.empty-state{text-align:center;padding:40px 20px;color:#aaa}
.empty-state .icon{font-size:40px;margin-bottom:8px}
.empty-state p{font-size:13px}

/* Scrollbar */
.main-content::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<!-- Splash Screen -->
<div id="splash">
  <div class="logo">📍</div>
  <h1>陌拜通</h1>
  <p>美业采集助手</p>
  <div class="loader"></div>
</div>

<!-- Auth Page -->
<div id="auth-page" class="page active">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="icon">📍</div>
      <h1>陌拜通</h1>
      <p>郑州美业 · 陌拜采集管理系统</p>
    </div>
    <div class="auth-card" id="login-form">
      <h2>登录</h2>
      <div class="field"><label><span class="req">*</span> 手机号</label><input type="tel" id="login-phone" placeholder="11位手机号" maxlength="11"></div>
      <div class="field"><label><span class="req">*</span> 密码</label><input type="password" id="login-pwd" placeholder="请输入密码"></div>
      <button class="btn btn-primary btn-block" onclick="login()">登 录</button>
      <div class="auth-switch">还没有账号？<a onclick="showRegister()">立即注册</a></div>
    </div>
    <div class="auth-card" id="register-form" style="display:none">
      <h2>注册</h2>
      <div class="field"><label><span class="req">*</span> 真实姓名</label><input type="text" id="reg-name" placeholder="请输入真实姓名"></div>
      <div class="field"><label><span class="req">*</span> 手机号</label><div style="display:flex;gap:6px"><input type="tel" id="reg-phone" placeholder="11位手机号" maxlength="11" style="flex:1"><button class="btn btn-sm btn-outline" onclick="sendSmsCode()" id="smsBtn" style="width:auto;white-space:nowrap;padding:10px 8px;font-size:11px">发送验证码</button></div></div><div class="field"><label><span class="req">*</span> 短信验证码</label><input type="text" id="reg-sms" placeholder="请输入6位验证码" maxlength="6"></div>
      <div class="field"><label><span class="req">*</span> 身份证号</label><input type="text" id="reg-id" placeholder="18位身份证号" maxlength="18"></div>
      <div class="field"><label><span class="req">*</span> 设置密码</label><input type="password" id="reg-pwd" placeholder="不少于6位"></div>
      <div class="field"><label>角色</label>
        <select id="reg-role" onchange="document.getElementById('admin-code-field').style.display=this.value==='admin'?'block':'none'">
          <option value="worker">陌拜员</option><option value="admin">管理者</option>
        </select>
      </div>
      <div class="field" id="admin-code-field" style="display:none">
        <label><span class="req">*</span> 管理者邀请码</label>
        <input type="text" id="reg-admin-code" placeholder="请联系管理员获取邀请码">
      </div>
      <button class="btn btn-success btn-block" onclick="register()">注 册</button>
      <div class="auth-switch">已有账号？<a onclick="showLogin()">去登录</a></div>
    </div>
  </div>
</div>

<!-- Main Layout -->
<div id="main-layout">
  <div class="top-bar">
    <span class="back-btn" id="backBtn" onclick="goBack()">‹</span>
    <span class="title" id="pageTitle">陌拜通</span>
    <div class="user-info"><span id="userName"></span><span class="role-badge" id="userRole"></span></div>
  </div>
  <div class="main-content" id="mainContent"></div>
</div>

<!-- Tab Bar -->
<div class="tab-bar" id="tabBar">
  <div class="tab-item active" data-tab="home" onclick="switchTab('home')"><span class="tab-icon">🏠</span>首页</div>
  <div class="tab-item" data-tab="checkin" onclick="switchTab('checkin')"><span class="tab-icon">✅</span>签到</div>
  <div class="tab-item" data-tab="visit" onclick="switchTab('visit')"><span class="tab-icon">📝</span>上报</div>
  <div class="tab-item" data-tab="records" onclick="switchTab('records')"><span class="tab-icon">📋</span>记录</div>
  <div class="tab-item" data-tab="moments" onclick="switchTab('moments')"><span class="tab-icon">🌐</span>动态</div>
  <div class="tab-item" data-tab="library" onclick="switchTab('library')"><span class="tab-icon">📚</span>学习库</div>
  <div class="tab-item" data-tab="profile" onclick="switchTab('profile')"><span class="tab-icon">👤</span>我的</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== App State ======
var DB_NAME = 'mobai_db';
var DB_VER = 2;
var db = null;
var currentUser = null;
var currentPage = 'home';
var currentVisit = null;
var locationCache = null;
var photoData = {};

// ====== IndexedDB ======
function openDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = function(e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('users')) {
        var us = d.createObjectStore('users', { keyPath: 'phone' });
        us.createIndex('role', 'role', { unique: false });
      }
      if (!d.objectStoreNames.contains('checkins')) {
        var cs = d.createObjectStore('checkins', { keyPath: 'id', autoIncrement: true });
        cs.createIndex('phone', 'phone', { unique: false });
        cs.createIndex('date', 'date', { unique: false });
      }
      if (!d.objectStoreNames.contains('posts')) {
        var ps = d.createObjectStore('posts', { keyPath: 'id', autoIncrement: true });
        ps.createIndex('phone', 'phone', { unique: false });
      }
      if (!d.objectStoreNames.contains('comments')) {
        var cs = d.createObjectStore('comments', { keyPath: 'id', autoIncrement: true });
        cs.createIndex('postId', 'postId', { unique: false });
      }
      if (!d.objectStoreNames.contains('likes')) {
        var ls = d.createObjectStore('likes', { keyPath: 'id', autoIncrement: true });
        ls.createIndex('postId', 'postId', { unique: false });
      }
      if (!d.objectStoreNames.contains('resources')) {
        var rs = d.createObjectStore('resources', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('adminCodes')) {
        var ac = d.createObjectStore('adminCodes', { keyPath: 'code' });
      }
      if (!d.objectStoreNames.contains('visits')) {
        var vs = d.createObjectStore('visits', { keyPath: 'id', autoIncrement: true });
        vs.createIndex('phone', 'phone', { unique: false });
        vs.createIndex('date', 'date', { unique: false });
      }
    };
    req.onsuccess = function(e) { resolve(e.target.result); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

function dbAction(store, mode, fn) {
  return new Promise(function(resolve, reject) {
    var tx = db.transaction(store, mode);
    var s = tx.objectStore(store);
    fn(s, resolve, reject);
    tx.oncomplete = function() { resolve(); };
    tx.onerror = function(e) { reject(e.target.error); };
  });
}

// ====== Toast ======
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ====== Geo Location ======
function getLocation() {
  return new Promise(function(resolve) {
    if (locationCache) { resolve(locationCache); return; }
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(function(pos) {
      locationCache = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      resolve(locationCache);
    }, function() { resolve(null); }, { timeout: 5000, enableHighAccuracy: true });
  });
}

// ====== Auth ======
function showRegister() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = 'block';
}
function showLogin() {
  document.getElementById('login-form').style.display = 'block';
  document.getElementById('register-form').style.display = 'none';
}
var smsTimer = null;
function sendSmsCode() {
  var phone = document.getElementById('reg-phone').value.trim();
  if (phone.length < 11) return showToast('请输入正确的手机号');
  var btn = document.getElementById('smsBtn');
  if (btn.disabled) return;
  var code = String(Math.floor(100000 + Math.random() * 900000));
  sessionStorage.setItem('sms_code_'+phone, code);
  showToast('验证码已发送：' + code + '（模拟，正式上线对接短信服务商）');
  btn.disabled = true;
  var sec = 60;
  btn.textContent = sec + 's';
  smsTimer = setInterval(function() {
    sec--;
    btn.textContent = sec + 's';
    if (sec <= 0) { clearInterval(smsTimer); btn.disabled = false; btn.textContent = '发送验证码'; }
  }, 1000);
}
async function register() {
  var name = document.getElementById('reg-name').value.trim();
  var phone = document.getElementById('reg-phone').value.trim();
  var idNum = document.getElementById('reg-id').value.trim();
  var pwd = document.getElementById('reg-pwd').value;
  var role = document.getElementById('reg-role').value;
  if (!name || !phone || !idNum || !pwd) return showToast('请填写完整信息');
  if (phone.length < 11) return showToast('手机号格式不对');
  var smsCode = document.getElementById('reg-sms').value.trim();
  var storedSms = sessionStorage.getItem('sms_code_'+phone);
  if (!smsCode || smsCode !== storedSms) return showToast('短信验证码错误，请重新获取');
  if (idNum.length < 18) return showToast('身份证号格式不对');
  if (pwd.length < 6) return showToast('密码不少于6位');
  try {
    var existing = await dbAction('users', 'readonly', function(s, ok) {
      var r = s.get(phone);
      r.onsuccess = function() { ok(r.result); };
    });
    if (existing) return showToast('该手机号已注册');
    var user = { phone: phone, name: name, idNumber: idNum, password: pwd, role: role,
      createdAt: new Date().toISOString(), totalVisits: 0, totalEarnings: 0 };
    await dbAction('users', 'readwrite', function(s) { s.add(user); });
    showToast('注册成功！请登录');
    showLogin();
    document.getElementById('login-phone').value = phone;
  } catch(e) { showToast('注册失败: ' + e.message); }
}

async function login() {
  var phone = document.getElementById('login-phone').value.trim();
  var pwd = document.getElementById('login-pwd').value;
  if (!phone || !pwd) return showToast('请填写手机号和密码');
  try {
    var user = await dbAction('users', 'readonly', function(s, ok) {
      var r = s.get(phone);
      r.onsuccess = function() { ok(r.result); };
    });
    if (!user) return showToast('账号不存在');
    if (user.password !== pwd) return showToast('密码错误');
    currentUser = user;
    localStorage.setItem('mobai_user', JSON.stringify({phone:user.phone,name:user.name,role:user.role}));
    document.getElementById('splash').classList.add('hide');
    document.getElementById('auth-page').classList.remove('active');
    document.getElementById('main-layout').classList.add('active');
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userRole').textContent = user.role === 'admin' ? '管理者' : '陌拜员';
    if (user.role === 'admin') showAdminTab();
    renderHome();
  } catch(e) { showToast('登录失败: ' + e.message); }
}

function showAdminTab() {
  // Admin tab is accessible from tab bar
}

// ====== Tab System ======
function switchTab(tab) {
  currentPage = tab;
  document.querySelectorAll('.tab-item').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.getElementById('backBtn').classList.remove('show');
  var titles = { home: '陌拜通', checkin: '每日签到', visit: '陌拜上报', records: '工作记录', moments: '工作圈', library: '学习库', profile: '个人中心', admin: '管理后台' };
  document.getElementById('pageTitle').textContent = titles[tab] || '陌拜通';
  if (tab === 'home') renderHome();
  else if (tab === 'checkin') renderCheckin();
  else if (tab === 'visit') renderVisitForm();
  else if (tab === 'records') renderRecords();
  else if (tab === 'profile') renderProfile();
  else if (tab === 'admin') renderAdmin();
  else if (tab === 'moments') renderMoments();
  else if (tab === 'library') renderLibrary();
}

function goBack() {
  document.getElementById('backBtn').classList.remove('show');
  if (currentPage==="worker-detail") { switchTab("admin"); return; }
  switchTab(currentPage);
}

// ====== Render: Home ======
async function renderHome() {
  var content = document.getElementById('mainContent');
  var today = new Date().toISOString().split('T')[0];
  var visits = await dbAction('visits', 'readonly', function(s, ok) {
    var r = s.getAll();

async function doCheckin() {
  locationCache = null;
  showToast('正在获取GPS位置...');
  var loc = await getLocation();
  if (!loc) { showToast('无法获取位置，请打开手机GPS定位权限后重试'); return; }
  var today = new Date().toISOString().split('T')[0];
  var now = new Date();
  var timeStr = now.toLocaleString('zh-CN', { hour12: false });
  try {
    await dbAction('checkins', 'readwrite', function(s) {
      s.add({ phone: currentUser.phone, date: today, time: timeStr, 
        location: loc, timestamp: now.toISOString() });
    });
    showToast('✅ 签到成功！');
    if (currentPage === 'home') renderHome();
    else renderCheckin();
  } catch(e) { showToast('签到失败'); }

function takePhoto(slot) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      var el = document.getElementById('photo-'+slot);
      photoData[slot] = ev.target.result;
      el.innerHTML = '<img src="'+ev.target.result+'"><div class="check">✓</div>';
      el.classList.add('has-photo');
      calcPay();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function calcPay() {
  var el = document.getElementById('payPreview');
  if (!el) return;
  var hasName = document.getElementById('v-name') && document.getElementById('v-name').value.trim();
  var hasAddr = document.getElementById('v-addr') && document.getElementById('v-addr').value.trim();
  var hasSurname = document.getElementById('v-surname') && document.getElementById('v-surname').value.trim();
  var hasPhone = document.getElementById('v-phone') && document.getElementById('v-phone').value.trim().length >= 11;
  var photos = Object.keys(photoData).length;
  var hasQR = document.getElementById('v-qrcode') && document.getElementById('v-qrcode').value === '1';

  if (!hasName || !hasAddr || !hasSurname || !hasPhone) {
    el.innerHTML = '⚠️ 请先填写完整的店铺信息（店名、地址、老板姓、电话）';
    el.style.color = '#856404'; el.style.background = '#fff3cd';
    return;
  }
  var pay = 4.0; // Basic
  if (photos >= 4) pay = 5.0; // With all photos
  else if (photos >= 2) pay = 4.5;
  if (hasQR) pay += 0.3;
  // Intent bonus
  var intent = document.getElementById('v-intent');
  if (intent) {
    var iv = intent.value;
    if (iv === 'S') pay += 0.5;
    else if (iv === 'A') pay += 0.3;
  }
  el.innerHTML = '💰 <strong>'+pay.toFixed(2)+' 元</strong>'+
    '<br><span style="font-size:10px">基础 '+ (photos>=4?'5.00':'4.00') +' 元'+
    (hasQR?' + 二维码 0.30 元':'')+
    (intent && intent.value==='S'?' + S级奖励 0.50 元':'')+
    (intent && intent.value==='A'?' + A级奖励 0.30 元':'')+
    ' | 照片 '+photos+' 张</span>';
  el.style.color = '#155724'; el.style.background = '#d4edda';
  return pay;
}

async function saveVisit() {
  if (currentEditId) {
    try { await dbAction("visits","readwrite",function(s){s.delete(currentEditId);}); } catch(e) {}
    currentEditId = null;
  }
  var name = document.getElementById('v-name').value.trim();
  var addr = document.getElementById('v-addr').value.trim();
  var surname = document.getElementById('v-surname').value.trim();
  var phone = document.getElementById('v-phone').value.trim();
  if (!name || !addr || !surname || !phone) return showToast('请填写必填信息');
  if (phone.length < 11) return showToast('电话格式不对');

  var needs = [];
  if (document.getElementById('need-tuoke').checked) needs.push('拓客');
  if (document.getElementById('need-zhaopin').checked) needs.push('招聘');
  if (document.getElementById('need-yeji').checked) needs.push('做业绩');
  if (document.getElementById('need-xinpin').checked) needs.push('新品项');

  var loc = await getLocation();
  var pay = calcPay();
  if (typeof pay !== 'number') pay = 4.0;

  var visit = {
    phone: currentUser.phone, userName: currentUser.name,
    date: new Date().toISOString().split('T')[0],
    time: new Date().toLocaleString('zh-CN', {hour12:false}),
    storeName: name, storeAddr: addr, storeType: document.getElementById('v-type').value,
    surname: surname, fullname: document.getElementById('v-fullname').value.trim(),
    contactPhone: phone, wechat: document.getElementById('v-wechat').value.trim(),
    intent: document.getElementById('v-intent').value,
    needs: needs, qrcode: document.getElementById('v-qrcode').value,
    photos: JSON.stringify(photoData),
    photosCount: Object.keys(photoData).length,
    note: document.getElementById('v-note').value.trim(),
    earnings: pay, location: loc,
    timestamp: new Date().toISOString()
  };

  try {
    await dbAction('visits', 'readwrite', function(s) { s.add(visit); });
    // Update user stats
    var user = await dbAction('users', 'readonly', function(s, ok) {
      var r = s.get(currentUser.phone); r.onsuccess = function() { ok(r.result); };
    });
    user.totalVisits = (user.totalVisits||0) + 1;
    user.totalEarnings = (user.totalEarnings||0) + pay;
    await dbAction('users', 'readwrite', function(s) { s.put(user); });
    currentUser = user;
    
    showToast('✅ 上报成功！本次酬劳 '+pay.toFixed(2)+' 元');
    resetVisitForm();
    switchTab('records');
  } catch(e) { showToast('保存失败'); }
}

function escHtml(s) { if(!s)return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function exportData() {
  var data = { exportDate: new Date().toISOString(), visits: [] };
  dbAction('visits', 'readonly', function(s, ok) {
    var r = s.getAll();
    r.onsuccess = function() {
      data.visits = (r.result||[]).filter(function(v) { return v.phone === currentUser.phone; });
      var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = '陌拜数据_'+currentUser.name+'_'+new Date().toISOString().split('T')[0]+'.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('✅ 数据已导出');
    };
  });
}

function importData() {
  var input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = function(e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = async function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!data.visits || !Array.isArray(data.visits)) return showToast('数据格式不对');
        var count = 0;
        for (var v of data.visits) {
          try { await dbAction('visits', 'readwrite', function(s) { s.add(v); }); count++; } catch(e) {}
        }
        showToast('✅ 导入 '+count+' 条记录');
        renderRecords();
      } catch(e) { showToast('导入失败'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

var postImages = [];
function addPostImage() {
  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.onchange = function(e) {
    for (var i = 0; i < e.target.files.length; i++) {
      var reader = new FileReader();
      reader.onload = function(ev) { postImages.push(ev.target.result); };
      reader.readAsDataURL(e.target.files[i]);
    }
  };
  input.click();
}

async function submitPost() {
  var text = document.getElementById('post-text').value.trim();
  if (!text) { showToast('请输入内容'); return; }
  try {
    await dbAction('posts', 'readwrite', function(s) {
      s.add({phone:currentUser.phone, userName:currentUser.name, text:text,
        images:JSON.stringify(postImages), likeCount:0, commentCount:0,
        timestamp:new Date().toISOString()});
    });
    postImages = [];
    var overlay = document.querySelector('[style*="fixed"]');
    if (overlay) overlay.remove();
    showToast('发布成功！');
    renderMoments();
  } catch(e) { showToast('发布失败'); }
}

async function toggleLike(postId) {
  var existing = await dbAction('likes', 'readonly', function(s, ok) {
    var idx = s.index('postId');
    var r = idx.getAll(IDBKeyRange.only(postId));
    r.onsuccess = function() { ok((r.result||[]).filter(function(l){return l.phone===currentUser.phone;})); };
  });
  if (existing.length > 0) {
    await dbAction('likes', 'readwrite', function(s) { s.delete(existing[0].id); });
  } else {
    await dbAction('likes', 'readwrite', function(s) { s.add({postId:postId,phone:currentUser.phone,timestamp:new Date().toISOString()}); });
  }
  renderMoments();
}

function showComment(postId) {
  var text = prompt('输入评论内容：');
  if (!text) return;
  dbAction('comments', 'readwrite', function(s) {
    s.add({postId:postId,phone:currentUser.phone,userName:currentUser.name,text:text,timestamp:new Date().toISOString()});
  }).then(function() {
    // Update comment count
    dbAction('comments', 'readonly', function(s, ok) {
      var idx = s.index('postId');
      var r = idx.getAll(IDBKeyRange.only(postId));
      r.onsuccess = function() {
        var count = (r.result||[]).length;
        dbAction('posts', 'readwrite', function(s2, ok2) {
          var r2 = s2.get(postId);
          r2.onsuccess = function() {
            var p = r2.result;

          };
        });
      };
    });

  });

  var title = document.getElementById('res-title').value.trim();
  var desc = document.getElementById('res-desc').value.trim();
  var type = document.getElementById('res-type').value;
  if (!title) return showToast('请输入标题');

  if (type === 'text') {
    data = document.getElementById('res-text').value.trim();
    if (!data) return showToast('请输入内容');
  } else {
    var fileInput = document.getElementById('res-image');

    data = await new Promise(function(ok) {
      var reader = new FileReader();
      reader.onload = function(ev) { ok(ev.target.result); };
      reader.readAsDataURL(fileInput.files[0]);
    });
  }
  try {
    await dbAction('resources', 'readwrite', function(s) {
      s.add({title:title, description:desc, type:type, data:data,
        userName:currentUser.name, phone:currentUser.phone, timestamp:new Date().toISOString()});

          document.getElementById('splash').classList.add('hide');
          document.getElementById('auth-page').classList.remove('active');
          document.getElementById('main-layout').classList.add('active');
          document.getElementById('userName').textContent = user.name;
          document.getElementById('userRole').textContent = user.role==='admin'?'管理者':'陌拜员';
          renderHome(); return;
        }
      } catch(e) {}
    }
    document.getElementById('splash').classList.add('hide');
  } catch(e) {
    document.getElementById('splash').classList.add('hide');
    showToast('数据库打开失败: '+e.message);
  }
}

init();
</script>
</body>
</html>
